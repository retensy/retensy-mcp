name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check src/index.mjs
          node --check scripts/smoke.mjs
          node --check scripts/telemetry.test.mjs
          node --check scripts/live-edit-422.test.mjs
          node --check scripts/broadcast-connect.test.mjs
          node --check scripts/integration-core.test.mjs
          node --check skills/build-bot-funnel/validate.mjs
      - name: Smoke test (MCP stdio)
        run: node scripts/smoke.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
      # Проверяет, что отчёт о неудаче уходит и НЕ содержит секретов.
      # Webhook подменяется на локальный сервер — реальный вебхук из CI не дёргается.
      - name: Telemetry redaction test
        run: node scripts/telemetry.test.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
      - name: API error formatting test (422/409)
        run: node scripts/live-edit-422.test.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
      # Аргументы → запрос (рассылки, подключения) и ссылки вместо отказа (OAuth, Instagram, 402).
      - name: Broadcast & connect test
        run: node scripts/broadcast-connect.test.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
      # Integration Core (каталог/статус/проверка), пост в канал, coreDelivery; секреты не попадают в вывод.
      - name: Integration core test
        run: node scripts/integration-core.test.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
