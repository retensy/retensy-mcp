name: Publish to npm

# Публикация по тегу vX.Y.Z. Требует секрет репозитория NPM_TOKEN
# (npm → Access Tokens → Automation/Granular, права publish на пакет).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    # Self-hosted раннер на ПК владельца (метка `pc`). Теги пушат только участники с правом записи.
    # npm provenance на self-hosted раннерах не поддерживается — публикация без --provenance.
    if: github.repository == 'retensy/retensy-mcp'
    runs-on: [self-hosted, pc]
    defaults:
      run:
        shell: cmd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          RETENSY_MCP_AUTOUPDATE: "0"
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
